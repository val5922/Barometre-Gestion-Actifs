# Mise à jour automatique du baromètre, du lundi au samedi à 7h (heure de Paris en hiver).
name: Mise à jour du baromètre

on:
  schedule:
    - cron: "0 6 * * 1-6"
  workflow_dispatch: # permet aussi de lancer la mise à jour à la main depuis GitHub

permissions:
  contents: write

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python collecte.py
      - run: python score.py
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data.json
          git diff --staged --quiet || git commit -m "Mise à jour des données $(date +%F)"
          git push
